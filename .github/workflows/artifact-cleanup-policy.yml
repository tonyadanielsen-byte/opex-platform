name: Configure Firebase artifact cleanup
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/artifact-cleanup-policy.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OPEX_NORTURA }}
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Seven-day cleanup of build images in europe-west1
        run: firebase functions:artifacts:setpolicy --location europe-west1 --days 7 --project opex-nortura --non-interactive
