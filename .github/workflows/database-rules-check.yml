name: Firebase database rules checks
on:
  pull_request:
    paths:
      - "database.rules.json"
      - "tests/rtdb-rules.test.cjs"
      - ".github/workflows/database-rules-check.yml"
  push:
    branches: [main]
    paths:
      - "database.rules.json"
      - "tests/rtdb-rules.test.cjs"
      - ".github/workflows/database-rules-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify versioned RTDB rule baseline
        run: node --test tests/rtdb-rules.test.cjs
