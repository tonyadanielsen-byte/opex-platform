name: Deploy Firebase Functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "firebase.json"
      - ".firebaserc"

permissions:
  contents: read

concurrency:
  group: firebase-functions-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install test dependencies
        run: |
          npm install --prefix functions --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 @firebase/rules-unit-testing@4.0.1 firebase@11.10.0 firebase-tools@14.17.0
          npx playwright install --with-deps chromium
      - name: Full Saker regression suite
        run: node --test $(find tests -maxdepth 1 -name '*.test.cjs' ! -name 'rtdb-emulator.test.cjs' | sort)
      - name: Firebase RTDB emulator permissions
        run: npx firebase --config firebase.rules-test.json emulators:exec --only database --project opex-rules-local-test "node --test tests/rtdb-emulator.test.cjs"
  deploy:
    needs: validate
    name: Deploy to opex-nortura
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package.json

      - name: Install function dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OPEX_NORTURA }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Firebase Functions
        run: firebase deploy --only functions --project opex-nortura --non-interactive
